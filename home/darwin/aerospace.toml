# AeroSpace config — Hyprland-style keybindings using alt as mod key
# See: https://nikitabobko.github.io/AeroSpace/guide

# Commands that run after AeroSpace startup
after-startup-command = []

# Start AeroSpace at login
start-at-login = false

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
default-root-container-orientation = 'auto'

# Mouse follows focus (Hyprland default behavior)
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center']

# Disable macOS "Hide application" (cmd-h) since we use alt-h for focus
automatically-unhide-macos-hidden-apps = true

[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*)
[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

# 'main' binding mode
[mode.main.binding]

# See: https://nikitabobko.github.io/AeroSpace/commands#layout
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
# --boundaries all-monitors-outer-frame: focus crosses monitor boundaries (Hyprland behavior)
alt-h = 'focus --boundaries all-monitors-outer-frame left'
alt-j = 'focus --boundaries all-monitors-outer-frame down'
alt-k = 'focus --boundaries all-monitors-outer-frame up'
alt-l = 'focus --boundaries all-monitors-outer-frame right'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
# --boundaries all-monitors-outer-frame: move window to adjacent monitor when at edge (Hyprland behavior)
alt-shift-h = 'move --boundaries all-monitors-outer-frame left'
alt-shift-j = 'move --boundaries all-monitors-outer-frame down'
alt-shift-k = 'move --boundaries all-monitors-outer-frame up'
alt-shift-l = 'move --boundaries all-monitors-outer-frame right'

# See: https://nikitabobko.github.io/AeroSpace/commands#resize
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Toggle fullscreen (Hyprland: mod+F, but alt-f is workspace F below — use alt-shift-f instead)
# If you'd rather use alt-f for fullscreen, remove the 'alt-f = workspace F' line below
alt-shift-f = 'fullscreen'

# Toggle floating/tiling (Hyprland: mod+V or mod+shift+space)
alt-shift-space = 'layout floating tiling'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-a = 'workspace A'
alt-b = 'workspace B'
alt-c = 'workspace C'
alt-d = 'workspace D'
alt-e = 'workspace E'
alt-f = 'workspace F'
alt-g = 'workspace G'
alt-i = 'workspace I'
alt-m = 'workspace M'
alt-n = 'workspace N'
alt-o = 'workspace O'
alt-p = 'workspace P'
alt-q = 'workspace Q'
alt-r = 'workspace R'
alt-s = 'workspace S'
alt-t = 'workspace T'
alt-u = 'workspace U'
alt-v = 'workspace V'
alt-w = 'workspace W'
alt-x = 'workspace X'
alt-y = 'workspace Y'
alt-z = 'workspace Z'

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
# --focus-follows-window: follow the window to its new workspace (Hyprland behavior)
alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
alt-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
alt-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
alt-shift-9 = 'move-node-to-workspace --focus-follows-window 9'
alt-shift-a = 'move-node-to-workspace --focus-follows-window A'
alt-shift-b = 'move-node-to-workspace --focus-follows-window B'
alt-shift-c = 'move-node-to-workspace --focus-follows-window C'
alt-shift-d = 'move-node-to-workspace --focus-follows-window D'
alt-shift-e = 'move-node-to-workspace --focus-follows-window E'
alt-shift-g = 'move-node-to-workspace --focus-follows-window G'
alt-shift-i = 'move-node-to-workspace --focus-follows-window I'
alt-shift-m = 'move-node-to-workspace --focus-follows-window M'
alt-shift-n = 'move-node-to-workspace --focus-follows-window N'
alt-shift-o = 'move-node-to-workspace --focus-follows-window O'
alt-shift-p = 'move-node-to-workspace --focus-follows-window P'
alt-shift-q = 'move-node-to-workspace --focus-follows-window Q'
alt-shift-r = 'move-node-to-workspace --focus-follows-window R'
alt-shift-s = 'move-node-to-workspace --focus-follows-window S'
alt-shift-t = 'move-node-to-workspace --focus-follows-window T'
alt-shift-u = 'move-node-to-workspace --focus-follows-window U'
alt-shift-v = 'move-node-to-workspace --focus-follows-window V'
alt-shift-w = 'move-node-to-workspace --focus-follows-window W'
alt-shift-x = 'move-node-to-workspace --focus-follows-window X'
alt-shift-y = 'move-node-to-workspace --focus-follows-window Y'
alt-shift-z = 'move-node-to-workspace --focus-follows-window Z'

# See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
alt-tab = 'workspace-back-and-forth'
# See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# See: https://nikitabobko.github.io/AeroSpace/commands#mode
alt-shift-semicolon = 'mode service'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = [
    'layout floating tiling',
    'mode main',
] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

# sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
#s = ['layout sticky tiling', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

down = 'volume down'
up = 'volume up'
shift-down = ['volume set 0', 'mode main']
