# GlazeWM: home/linux/hyprland.lua, as close as Windows allows.
# Copied to %USERPROFILE%\.glzr\glazewm\config.yaml by home/windows on every
# `home-manager switch`; edit it here, not there. Alt+Shift+R reloads it.
# Reference: https://github.com/glzr-io/glazewm#config-documentation
#
# Mod key is Alt, like AeroSpace on the Mac: Windows keeps most Win+key combos for itself.
# Several Hyprland/Noctalia keys are already built into Windows, so they're left alone:
#   Hyprland              Windows
#   Super+Space launcher  PowerToys Run (Alt+Space) or Command Palette (Win+Alt+Space)
#   Super+V clipboard     Win+V
#   Super+. emoji         Win+.
#   Print screenshots     Print / Win+Shift+S
#   Super+Shift+Q lock    Win+L
#   Ctrl+Shift+Esc btop   Ctrl+Shift+Esc (Task Manager)
#   Alt+Tab               Alt+Tab

general:
  # Zebar is the bar (home/windows/zebar, Noctalia's place)
  startup_commands: ['shell-exec zebar']
  shutdown_commands: ['shell-exec taskkill /IM zebar.exe /F']
  config_reload_commands: []

  # Hyprland: focus follows the mouse, and the cursor jumps to windows focused by key
  focus_follows_cursor: true
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: true
    trigger: 'window_focus'

  hide_method: 'cloak'
  show_all_in_taskbar: false

# Hyprland gaps_in = 3 (per window, so 6 between two), gaps_out = 8.
# Top leaves room for the 32px Zebar bar.
gaps:
  scale_with_dpi: true
  inner_gap: '6px'
  outer_gap:
    top: '40px'
    right: '8px'
    bottom: '8px'
    left: '8px'

# Borders and rounding like Hyprland with Noctalia's Monokai Pro theme
# (mPrimary for the focused window, mOutline for the rest). Windows 11 only.
window_effects:
  focused_window:
    border:
      enabled: true
      color: '#78a9ff'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'
    transparency:
      enabled: false
      opacity: '100%'
  other_windows:
    border:
      enabled: true
      color: '#69676c'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: 'rounded'
    transparency:
      enabled: false
      opacity: '100%'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

# 1-10 like Hyprland (Alt+0 is 10), plus S for the special (scratchpad) workspace
workspaces:
  - name: '1'
  - name: '2'
  - name: '3'
  - name: '4'
  - name: '5'
  - name: '6'
  - name: '7'
  - name: '8'
  - name: '9'
  - name: '10'
  - name: 'S'

window_rules:
  - commands: ['ignore']
    match:
      # Zebar itself
      - window_process: { equals: 'zebar' }
      # Browser picture-in-picture stays floating and on top (Hyprland: float + pin)
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }
      # Popups from PowerToys and Office that shouldn't tile
      - window_process: { equals: 'PowerToys' }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_title: { equals: 'Command Palette' }
        window_class: { equals: 'WinUIDesktopWin32WindowClass' }
      - window_process: { equals: 'PowerToys' }
        window_title: { regex: '.*? - Peek' }
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }

  # Hyprland: Discord opens on workspace 1
  - commands: ['move --workspace 1']
    match:
      - window_process: { equals: 'Discord' }

  # Hyprland: calculator and Steam's friends list float
  - commands: ['set-floating --centered']
    match:
      - window_title: { equals: 'Calculator' }
      - window_process: { equals: 'steamwebhelper' }
        window_title: { equals: 'Friends List' }

keybindings:
  # ── Windows (Hyprland: WINDOW MANAGEMENT) ──
  - commands: ['close']
    bindings: ['alt+q']
  - commands: ['toggle-floating --centered']
    bindings: ['alt+shift+space']
  # Super+D: fullscreen that keeps the bar and gaps (maximize)
  - commands: ['toggle-fullscreen --maximized']
    bindings: ['alt+d']
  - commands: ['toggle-fullscreen']
    bindings: ['alt+f']
  # Super+/: togglesplit
  - commands: ['toggle-tiling-direction']
    bindings: ['alt+oem_question']

  - commands: ['focus --direction left']
    bindings: ['alt+h']
  - commands: ['focus --direction right']
    bindings: ['alt+l']
  - commands: ['focus --direction up']
    bindings: ['alt+k']
  - commands: ['focus --direction down']
    bindings: ['alt+j']

  - commands: ['move --direction left']
    bindings: ['alt+shift+h']
  - commands: ['move --direction right']
    bindings: ['alt+shift+l']
  - commands: ['move --direction up']
    bindings: ['alt+shift+k']
  - commands: ['move --direction down']
    bindings: ['alt+shift+j']

  # Super+= / Super+-: grow / shrink by 50px
  - commands: ['resize --width +50px', 'resize --height +50px']
    bindings: ['alt+oem_plus']
  - commands: ['resize --width -50px', 'resize --height -50px']
    bindings: ['alt+oem_minus']

  # Move the current workspace to the monitor in that direction (Hyprland: Super+Shift+Tab).
  # GlazeWM has no "next monitor" with wrap-around, so Alt+Shift+Tab sends it right.
  - commands: ['move-workspace --direction left']
    bindings: ['alt+ctrl+shift+h']
  - commands: ['move-workspace --direction right']
    bindings: ['alt+ctrl+shift+l', 'alt+shift+tab']
  - commands: ['move-workspace --direction up']
    bindings: ['alt+ctrl+shift+k']
  - commands: ['move-workspace --direction down']
    bindings: ['alt+ctrl+shift+j']

  # ── Apps (Hyprland: DEFAULT APPS) ──
  # Full path: the Alacritty installer's PATH change only reaches apps started after it
  - commands: ['shell-exec %ProgramFiles%/Alacritty/alacritty.exe']
    bindings: ['alt+enter']
  - commands: ['shell-exec explorer']
    bindings: ['alt+e']
  - commands: ['shell-exec brave --new-window']
    bindings: ['alt+w']

  # ── GlazeWM itself (no Hyprland equivalent) ──
  - commands: ['wm-reload-config']
    bindings: ['alt+shift+r']
  # Pause tiling and every key here, e.g. for a game or Remote Desktop
  - commands: ['wm-toggle-pause']
    bindings: ['alt+shift+p']
  - commands: ['wm-exit']
    bindings: ['alt+shift+e']

  # ── Workspaces (Hyprland: WORKSPACES) ──
  # Alt+N: go to N. Alt+Shift+N: take the window there. Alt+Ctrl+N: send it, stay here.
  - commands: ['focus --workspace 1']
    bindings: ['alt+1']
  - commands: ['focus --workspace 2']
    bindings: ['alt+2']
  - commands: ['focus --workspace 3']
    bindings: ['alt+3']
  - commands: ['focus --workspace 4']
    bindings: ['alt+4']
  - commands: ['focus --workspace 5']
    bindings: ['alt+5']
  - commands: ['focus --workspace 6']
    bindings: ['alt+6']
  - commands: ['focus --workspace 7']
    bindings: ['alt+7']
  - commands: ['focus --workspace 8']
    bindings: ['alt+8']
  - commands: ['focus --workspace 9']
    bindings: ['alt+9']
  - commands: ['focus --workspace 10']
    bindings: ['alt+0']

  - commands: ['move --workspace 1', 'focus --workspace 1']
    bindings: ['alt+shift+1']
  - commands: ['move --workspace 2', 'focus --workspace 2']
    bindings: ['alt+shift+2']
  - commands: ['move --workspace 3', 'focus --workspace 3']
    bindings: ['alt+shift+3']
  - commands: ['move --workspace 4', 'focus --workspace 4']
    bindings: ['alt+shift+4']
  - commands: ['move --workspace 5', 'focus --workspace 5']
    bindings: ['alt+shift+5']
  - commands: ['move --workspace 6', 'focus --workspace 6']
    bindings: ['alt+shift+6']
  - commands: ['move --workspace 7', 'focus --workspace 7']
    bindings: ['alt+shift+7']
  - commands: ['move --workspace 8', 'focus --workspace 8']
    bindings: ['alt+shift+8']
  - commands: ['move --workspace 9', 'focus --workspace 9']
    bindings: ['alt+shift+9']
  - commands: ['move --workspace 10', 'focus --workspace 10']
    bindings: ['alt+shift+0']

  - commands: ['move --workspace 1']
    bindings: ['alt+ctrl+1']
  - commands: ['move --workspace 2']
    bindings: ['alt+ctrl+2']
  - commands: ['move --workspace 3']
    bindings: ['alt+ctrl+3']
  - commands: ['move --workspace 4']
    bindings: ['alt+ctrl+4']
  - commands: ['move --workspace 5']
    bindings: ['alt+ctrl+5']
  - commands: ['move --workspace 6']
    bindings: ['alt+ctrl+6']
  - commands: ['move --workspace 7']
    bindings: ['alt+ctrl+7']
  - commands: ['move --workspace 8']
    bindings: ['alt+ctrl+8']
  - commands: ['move --workspace 9']
    bindings: ['alt+ctrl+9']
  - commands: ['move --workspace 10']
    bindings: ['alt+ctrl+0']

  # Alt+Ctrl+L / H: next / previous workspace. (Alt+Ctrl+Shift+H/J/K/L moves the
  # workspace to another monitor, above.)
  - commands: ['focus --next-workspace']
    bindings: ['alt+ctrl+l']
  - commands: ['focus --prev-workspace']
    bindings: ['alt+ctrl+h']

  # Special workspace: Alt+S shows it, Alt+Shift+S sends the window there.
  # Unlike Hyprland it's a normal workspace, so leave it with Alt+N.
  - commands: ['focus --workspace S']
    bindings: ['alt+s']
  - commands: ['move --workspace S']
    bindings: ['alt+shift+s']
